<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة المسؤول العام - Super Admin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="loginScreen" class="loginScreen">
  <form id="loginForm" class="authForm">
    <h1>لوحة المسؤول العام</h1>
    <label>البريد الإلكتروني <input type="email" name="email" required /></label>
    <label>كلمة المرور <input type="password" name="password" required /></label>
    <button type="submit">دخول</button>
    <p class="hint" id="loginHint"></p>
  </form>
</div>

<div id="dashboard" class="dashboard" hidden>
  <header class="topbar">
    <div class="brand">⛪ المسؤول العام</div>
    <nav class="nav">
      <button class="navBtn" data-view="stats">الإحصائيات</button>
      <button class="navBtn" data-view="rooms">الغرف</button>
      <button class="navBtn" data-view="news">الأخبار</button>
      <button class="navBtn" data-view="bookings">الحجوزات</button>
      <button class="navBtn" data-view="users">المستخدمون</button>
      <button class="navBtn" id="logoutBtn">خروج</button>
    </nav>
  </header>

  <main id="app">

    <section id="view-stats" class="view">
      <h1>نظرة عامة</h1>
      <div id="statsGrid" class="statsGrid"></div>
    </section>

    <section id="view-rooms" class="view" hidden>
      <h1>إدارة الغرف</h1>
      <form id="roomForm" class="inlineForm">
        <input type="hidden" name="id" />
        <input type="text" name="number" placeholder="رقم الغرفة" required />
        <input type="number" name="capacity" placeholder="عدد الأسرّة" min="1" required />
        <input type="text" name="type" placeholder="النوع (اختياري)" />
        <input type="text" name="notes" placeholder="ملاحظات" />
        <button type="submit">حفظ</button>
        <button type="button" id="roomFormCancel" hidden>إلغاء التعديل</button>
      </form>
      <table class="dataTable">
        <thead><tr><th>الرقم</th><th>الأسرّة</th><th>النوع</th><th>الحالة</th><th>إجراءات</th></tr></thead>
        <tbody id="roomsTableBody"></tbody>
      </table>
    </section>

    <section id="view-news" class="view" hidden>
      <h1>إدارة الأخبار</h1>
      <form id="newsForm" class="inlineForm vertical">
        <input type="hidden" name="id" />
        <input type="text" name="title" placeholder="العنوان" required />
        <textarea name="body" placeholder="التفاصيل"></textarea>
        <select name="category">
          <option value="news">خبر</option>
          <option value="mass_schedule">مواعيد قداسات</option>
          <option value="conference">مؤتمر</option>
          <option value="meeting">اجتماع</option>
          <option value="event">مناسبة</option>
        </select>
        <label class="checkboxLabel"><input type="checkbox" name="isPinned" /> تثبيت الخبر</label>
        <button type="submit">حفظ</button>
        <button type="button" id="newsFormCancel" hidden>إلغاء التعديل</button>
      </form>
      <div id="newsAdminList" class="newsAdminList"></div>
    </section>

    <section id="view-bookings" class="view" hidden>
      <h1>كل الحجوزات</h1>
      <div class="filters">
        <select id="bookingStatusFilter">
          <option value="">كل الحالات</option>
          <option value="pending">قيد المراجعة</option>
          <option value="approved">مقبول</option>
          <option value="checked_in">تم تسجيل الوصول</option>
          <option value="completed">مكتمل</option>
          <option value="rejected">مرفوض</option>
          <option value="cancelled">ملغى</option>
        </select>
      </div>
      <div id="adminBookingsList" class="bookingsList"></div>
    </section>

    <section id="view-users" class="view" hidden>
      <h1>إدارة المستخدمين</h1>
      <form id="userForm" class="inlineForm">
        <input type="text" name="name" placeholder="الاسم" required />
        <input type="email" name="email" placeholder="البريد الإلكتروني" required />
        <input type="tel" name="phone" placeholder="الهاتف" />
        <input type="password" name="password" placeholder="كلمة المرور" required />
        <select name="roleName">
          <option value="booking_manager">مسؤول حجز</option>
          <option value="super_admin">مسؤول عام</option>
          <option value="user">مستخدم</option>
        </select>
        <button type="submit">إنشاء حساب</button>
      </form>
      <table class="dataTable">
        <thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>مفعّل؟</th><th>نشط؟</th><th>إجراءات</th></tr></thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </section>

  </main>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
