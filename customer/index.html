<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دير - Monastery Guesthouse</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">⛪ نظام حجز الدير</div>
  <nav class="nav">
    <button class="navBtn" data-view="news">الأخبار</button>
    <button class="navBtn" data-view="book">حجز جديد</button>
    <button class="navBtn" data-view="bookings">حجوزاتي</button>
    <button class="navBtn" id="authBtn" data-view="account">دخول / حسابي</button>
  </nav>
</header>

<main id="app">

  <!-- ============ NEWS ============ -->
  <section id="view-news" class="view">
    <h1>الأخبار والمواعيد</h1>
    <div id="newsList" class="newsList"></div>
  </section>

  <!-- ============ BOOKING ============ -->
  <section id="view-book" class="view" hidden>
    <h1>حجز جديد</h1>
    <div class="tabs">
      <button class="tabBtn active" data-tab="individual">حجز فرد</button>
      <button class="tabBtn" data-tab="full_room">حجز غرفة كاملة</button>
      <button class="tabBtn" data-tab="retreat">حجز خلوة (مجموعة)</button>
    </div>

    <form id="form-individual" class="bookingForm">
      <label>النوع
        <select name="gender" required>
          <option value="male">ولد</option>
          <option value="female">بنت</option>
        </select>
      </label>
      <label>تاريخ الوصول <input type="date" name="arrivalDate" required /></label>
      <label>تاريخ المغادرة <input type="date" name="departureDate" required /></label>
      <label>الكنيسة <input type="text" name="churchName" /></label>
      <label>رقم الهاتف <input type="tel" name="phone" required /></label>
      <label>العنوان <input type="text" name="address" /></label>
      <label>المحافظة <input type="text" name="governorate" /></label>
      <label>ملاحظات <textarea name="notes"></textarea></label>
      <button type="submit">إرسال طلب الحجز</button>
    </form>

    <form id="form-full_room" class="bookingForm" hidden>
      <label>عدد أفراد الأسرة <input type="number" name="familySize" min="1" required /></label>
      <label>تاريخ الوصول <input type="date" name="arrivalDate" required /></label>
      <label>تاريخ المغادرة <input type="date" name="departureDate" required /></label>
      <label>الكنيسة <input type="text" name="churchName" /></label>
      <label>رقم الهاتف <input type="tel" name="phone" required /></label>
      <label>العنوان <input type="text" name="address" /></label>
      <label>المحافظة <input type="text" name="governorate" /></label>
      <label>ملاحظات <textarea name="notes"></textarea></label>
      <button type="submit">إرسال طلب الحجز</button>
    </form>

    <form id="form-retreat" class="bookingForm" hidden>
      <label>اسم الكنيسة <input type="text" name="churchName" required /></label>
      <label>اسم المسؤول <input type="text" name="contactName" required /></label>
      <label>رقم الهاتف <input type="tel" name="phone" required /></label>
      <label>عدد الأفراد <input type="number" name="groupSize" min="1" required /></label>
      <label>أولاد أم بنات
        <select name="gender" required>
          <option value="male">أولاد</option>
          <option value="female">بنات</option>
        </select>
      </label>
      <label>تاريخ الوصول <input type="date" name="arrivalDate" required /></label>
      <label>تاريخ المغادرة <input type="date" name="departureDate" required /></label>
      <label>العنوان <input type="text" name="address" /></label>
      <label>المحافظة <input type="text" name="governorate" /></label>
      <label>ملاحظات <textarea name="notes"></textarea></label>
      <button type="submit">إرسال طلب الحجز</button>
    </form>

    <div id="bookingResult" class="resultBox" hidden></div>
  </section>

  <!-- ============ MY BOOKINGS ============ -->
  <section id="view-bookings" class="view" hidden>
    <h1>حجوزاتي</h1>
    <div id="myBookingsList" class="bookingsList"></div>
  </section>

  <!-- ============ ACCOUNT ============ -->
  <section id="view-account" class="view" hidden>

    <div id="accLoggedOut">
      <div class="tabs">
        <button class="tabBtn active" data-authtab="login">تسجيل الدخول</button>
        <button class="tabBtn" data-authtab="register">إنشاء حساب</button>
        <button class="tabBtn" data-authtab="forgot">نسيت كلمة المرور</button>
      </div>

      <form id="loginForm" class="authForm">
        <label>البريد الإلكتروني <input type="email" name="email" required /></label>
        <label>كلمة المرور <input type="password" name="password" required /></label>
        <button type="submit">دخول</button>
        <p class="hint" id="loginHint"></p>
      </form>

      <form id="registerForm" class="authForm" hidden>
        <label>الاسم <input type="text" name="name" required /></label>
        <label>البريد الإلكتروني <input type="email" name="email" required /></label>
        <label>رقم الهاتف <input type="tel" name="phone" /></label>
        <label>كلمة المرور <input type="password" name="password" minlength="8" required /></label>
        <button type="submit">إنشاء حساب</button>
      </form>

      <form id="verifyEmailForm" class="authForm" hidden>
        <p>تم إرسال رمز تفعيل مكوّن من 6 أرقام إلى بريدك الإلكتروني.</p>
        <label>البريد الإلكتروني <input type="email" name="email" required /></label>
        <label>رمز التفعيل (OTP) <input type="text" name="code" maxlength="6" required /></label>
        <button type="submit">تفعيل الحساب</button>
        <button type="button" id="resendOtpBtn">إعادة إرسال الرمز</button>
      </form>

      <form id="forgotForm" class="authForm" hidden>
        <label>البريد الإلكتروني <input type="email" name="email" required /></label>
        <button type="submit">إرسال رمز إعادة التعيين</button>
      </form>

      <form id="resetForm" class="authForm" hidden>
        <label>البريد الإلكتروني <input type="email" name="email" required /></label>
        <label>الرمز (OTP) <input type="text" name="code" maxlength="6" required /></label>
        <label>كلمة المرور الجديدة <input type="password" name="newPassword" minlength="8" required /></label>
        <button type="submit">تعيين كلمة المرور</button>
      </form>
    </div>

    <div id="accLoggedIn" hidden>
      <h1>حسابي</h1>
      <p id="profileInfo"></p>
      <button id="logoutBtn">تسجيل الخروج</button>

      <h2>تغيير كلمة المرور</h2>
      <form id="changePasswordRequestForm" class="authForm">
        <p>سيتم إرسال رمز تأكيد إلى بريدك الإلكتروني.</p>
        <button type="submit">إرسال رمز التأكيد</button>
      </form>
      <form id="changePasswordConfirmForm" class="authForm" hidden>
        <label>كلمة المرور الحالية <input type="password" name="currentPassword" required /></label>
        <label>كلمة المرور الجديدة <input type="password" name="newPassword" minlength="8" required /></label>
        <label>تأكيد كلمة المرور الجديدة <input type="password" name="confirmPassword" minlength="8" required /></label>
        <label>رمز التأكيد (OTP) <input type="text" name="code" maxlength="6" required /></label>
        <button type="submit">تغيير كلمة المرور</button>
      </form>
    </div>
  </section>

</main>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
