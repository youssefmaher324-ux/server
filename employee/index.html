<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة مسؤول الحجز - Booking Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="loginScreen" class="loginScreen">
  <form id="loginForm" class="authForm">
    <h1>لوحة مسؤول الحجز</h1>
    <label>البريد الإلكتروني <input type="email" name="email" required /></label>
    <label>كلمة المرور <input type="password" name="password" required /></label>
    <button type="submit">دخول</button>
    <p class="hint" id="loginHint"></p>
  </form>
</div>

<div id="dashboard" class="dashboard" hidden>
  <header class="topbar">
    <div class="brand">🛎️ مسؤول الحجز</div>
    <nav class="nav">
      <button class="navBtn" data-view="requests">طلبات الحجز</button>
      <button class="navBtn" data-view="checkin">تسجيل وصول (QR)</button>
      <button class="navBtn" id="logoutBtn">خروج</button>
    </nav>
  </header>

  <main id="app">

    <section id="view-requests" class="view">
      <h1>طلبات الحجز</h1>
      <div class="filters">
        <select id="statusFilter">
          <option value="pending">قيد المراجعة</option>
          <option value="approved">مقبول</option>
          <option value="checked_in">تم تسجيل الوصول</option>
          <option value="completed">مكتمل</option>
          <option value="rejected">مرفوض</option>
          <option value="cancelled">ملغى</option>
          <option value="">الكل</option>
        </select>
      </div>
      <div id="bookingsList" class="bookingsList"></div>
    </section>

    <section id="view-checkin" class="view" hidden>
      <h1>تسجيل وصول عن طريق QR</h1>
      <p>الصق محتوى رمز QR الممسوح (نص JSON) هنا:</p>
      <form id="qrForm" class="inlineForm">
        <textarea name="payload" placeholder='{"bookingId":"...","code":"MON-2026-000125"}' required></textarea>
        <button type="submit">تسجيل الوصول</button>
      </form>
      <div id="qrResult" class="resultBox" hidden></div>
    </section>

  </main>
</div>

<div id="reassignModal" class="modalScrim" hidden>
  <div class="modal">
    <h2>نقل إلى غرفة أخرى</h2>
    <select id="reassignRoomSelect"></select>
    <div class="modalActions">
      <button id="reassignConfirm">تأكيد النقل</button>
      <button id="reassignCancel">إلغاء</button>
    </div>
  </div>
</div>

<div id="messageModal" class="modalScrim" hidden>
  <div class="modal">
    <h2>إرسال رسالة للمستخدم</h2>
    <textarea id="messageText" placeholder="نص الرسالة"></textarea>
    <div class="modalActions">
      <button id="messageConfirm">إرسال</button>
      <button id="messageCancel">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
